# https://lefthook.dev/configuration/

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"
        - "site/**"
      run: uv run ruff check --fix {staged_files}
      stage_fixed: true
    format:
      glob: "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"
        - "site/**"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    type-check:
      run: uv run mypy openrestor
    codespell:
      glob: "*.py"
      exclude:
        - "tests/**"
        - "scripts/**"
        - "site/**"
      run: uv run codespell {staged_files} --skip="*.lock,*.svg,*.min.js,site/*"

commit-msg:
  commands:
    commitlint:
      run: uv run cz check --commit-msg-file {1}

pre-push:
  commands:
    smoke:
      run: uv run pytest tests/test_schemas.py -q
