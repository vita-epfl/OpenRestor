[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openrestor"
version = "0.1.0"
description = "Reproducible dataset preparation for the OpenRestor benchmark"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "librosa>=0.10", "pyloudnorm>=0.1", "pyroomacoustics>=0.7,<0.10", "jsonschema>=4.0", "matplotlib>=3.7", "h5py>=3.10"]

[project.optional-dependencies]
# Blind-Real discovery reads only metadata columns from remote IAMD parquet shards.
catalogue = ["pyarrow>=15", "fsspec>=2024.2", "aiohttp>=3.9"]
perceptual = ["torch>=2.9,<2.10", "torchaudio>=2.9,<2.10", "laion-clap==1.1.7", "fadtk", "audiobox-aesthetics==0.0.4"]
# Local/offline AST + CLAP + Audiobox probes and the optional logistic diagnostic.
curation = ["torch>=2.5,<3", "torchaudio>=2.5,<3", "transformers==4.46.3", "audiobox-aesthetics==0.0.4", "scikit-learn>=1.3,<2"]

[project.scripts]
openrestor-data = "openrestor.data.cli:main"
openrestor-degrade = "openrestor.degradations.cli:main"
openrestor-score = "openrestor.metrics.cli:main"
openrestor-validate = "openrestor.validation.cli:main"
openrestor-curate = "openrestor.curation.cli:main"

[tool.setuptools.packages.find]
include = ["openrestor*"]

[tool.ruff]
line-length = 100
target-version = "py311"
