name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: python -m openrestore.degradations.cli validate-config --config configs/degradations/single/v0_1.yaml
      - run: python -m openrestore.validation.cli index --input tests/fixtures/index.json
