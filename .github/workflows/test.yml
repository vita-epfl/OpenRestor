name: test

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check openrestore
      - run: uv run ruff format --check openrestore
      - run: uv run mypy openrestore
      - run: uv run codespell openrestore

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync
      - name: "Smoke: validate degradations config (from old CI)"
        run: uv run openrestore-degrade validate-config --config configs/degradations/single/v0_1.yaml
      - name: "Smoke: validate index fixture (from old CI)"
        run: uv run python -m openrestore.validation.cli index --input tests/fixtures/index.json
      - name: Run full test suite
        run: uv run pytest -v
