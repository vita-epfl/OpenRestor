name: test

"on":
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check openrestor
      - run: uv run ruff format --check openrestor
      - run: uv run mypy openrestor
      - run: uv run codespell openrestor

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
      - run: uv sync
      - name: "Smoke: validate degradations config (from old CI)"
        run: uv run openrestor-degrade validate-config --config configs/degradations/single/v0_1.yaml
      - name: "Smoke: validate index fixture (from old CI)"
        run: uv run python -m openrestor.validation.cli index --input tests/fixtures/index.json
      - name: Run full test suite
        run: uv run pytest -v
