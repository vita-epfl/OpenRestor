version: v0.1
sample_rate: 44100
# ARIEL/SonicMaster single degradations. Each effect samples original ARIEL
# parameter choices from the item seed; there are deliberately no preset levels.
recipes:
  - {id: single_comp, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: comp, parameters: {}}]}
  - {id: single_punch, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: punch, parameters: {}}]}
  - {id: single_xband, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: xband, parameters: {}}]}
  # Provide mic_ir_dir when rendering this recipe.
  - {id: single_mic, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: mic, parameters: {}}]}
  - {id: single_bright, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: bright, parameters: {}}]}
  - {id: single_dark, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: dark, parameters: {}}]}
  - {id: single_airy, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: airy, parameters: {}}]}
  - {id: single_boom, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: boom, parameters: {}}]}
  - {id: single_clarity, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: clarity, parameters: {}}]}
  - {id: single_mud, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: mud, parameters: {}}]}
  - {id: single_warm, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: warm, parameters: {}}]}
  - {id: single_vocal, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: vocal, parameters: {}}]}
  - {id: single_small, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: small, parameters: {}}]}
  - {id: single_big, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: big, parameters: {}}]}
  - {id: single_mix, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: mix, parameters: {}}]}
  # Provide real_rir_dir when rendering this recipe.
  - {id: single_real, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: real, parameters: {}}]}
  - {id: single_stereo, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: stereo, parameters: {}}]}
  - {id: single_clip, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: clip, parameters: {}}]}
  - {id: single_volume, recipe_type: single, severity: ariel_random, operations: [{primitive: ariel, variant: volume, parameters: {}}]}
  # OpenRestore-specific single effects; random ranges are stored in metadata.
  - {id: single_noise, recipe_type: single, severity: openrestore_random, operations: [{primitive: noise_interference, variant: broadband, parameters: {snr_db: {min: 15, max: 25}}}]}
  - {id: single_hum, recipe_type: single, severity: openrestore_random, operations: [{primitive: noise_interference, variant: hum, parameters: {snr_db: {min: 8, max: 16}, frequency_hz: {choices: [50, 60]}, harmonics: {min: 3, max: 5}}}]}
  - {id: single_codec, recipe_type: single, severity: openrestore_random, operations: [{primitive: codec_resampling, variant: mp3, parameters: {bitrate: {choices: [64k, 96k, 128k]}}}]}
  - {id: single_bandwidth, recipe_type: single, severity: openrestore_random, operations: [{primitive: bandwidth_filtering, variant: telephone, parameters: {}}]}
  - {id: single_channel_damage, recipe_type: single, severity: openrestore_random, operations: [{primitive: stereo_spatial, variant: one_channel_damage, parameters: {right_gain_db: {min: -10, max: -5}, cutoff_hz: {min: 2500, max: 5000}, right_lowpass: true}}]}
  - {id: single_distant_mic_capture, recipe_type: single, severity: openrestore_random, operations: [{primitive: distant_mic_capture, variant: room_capture, parameters: {}}]}
