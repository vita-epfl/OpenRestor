version: v0.1
sample_rate: 44100
canonical_registry: true
recipes:
- id: spectral_eq
  severity: strong_random
  operations:
  - primitive: spectral_eq
    parameters:
      mode:
        choices:
        - multi_band
        - high_shelf_cut
        - high_shelf_boost
        - air_cut
        - low_shelf_cut
        - low_shelf_thin
        - low_mid_emphasis
        - midrange_notch
        - broad_tilt
- id: smartphone_capture
  severity: strong_random
  operations:
  - primitive: device_mic_response
    variant: smartphone_capture
    parameters:
      highpass_hz:
        min: 90
        max: 250
      resonance_hz:
        min: 2500
        max: 5000
      resonance_db:
        min: 4
        max: 9
      lowpass_hz:
        min: 7000
        max: 14000
      agc_strength:
        min: 0.4
        max: 0.8
      drive:
        min: 1.5
        max: 3.0
      self_noise_snr_db:
        min: 38
        max: 52
- id: lowpass
  severity: strong_random
  operations:
  - primitive: bandwidth_filtering
    variant: lowpass
    parameters:
      cutoff_hz:
        min: 2500
        max: 6000
      preset:
        choices:
        - butterworth
        - sonicmaster
- id: highpass
  severity: strong_random
  operations:
  - primitive: bandwidth_filtering
    variant: highpass
    parameters:
      cutoff_hz:
        min: 300
        max: 1200
- id: compression
  severity: strong_random
  operations:
  - primitive: compression
    parameters:
      mode:
        choices:
        - strong_compression
        - transient_softening
- id: clipping
  severity: strong_random
  operations:
  - primitive: clipping
    parameters: {}
- id: saturation_overdrive
  severity: strong_random
  operations:
  - primitive: saturation_overdrive
    parameters:
      curve:
        choices:
        - soft
        - hard
        - asymmetric
      drive:
        min: 3.0
        max: 6.0
      threshold:
        min: 0.45
        max: 0.75
- id: reverb_small
  severity: strong_random
  operations:
  - primitive: ariel
    variant: small
    parameters: {}
- id: reverb_big
  severity: strong_random
  operations:
  - primitive: ariel
    variant: big
    parameters: {}
- id: reverb_mix
  severity: strong_random
  operations:
  - primitive: ariel
    variant: mix
    parameters: {}
- id: reverb_real
  severity: strong_random
  operations:
  - primitive: ariel
    variant: real
    parameters:
      real_rir_dir: assets/degradations/v0_1/real_rirs
- id: distant_mic_capture
  severity: strong_random
  operations:
  - primitive: distant_mic_capture
    variant: room_capture
    parameters:
      distance_m:
        min: 2.5
        max: 8.0
      absorption:
        min: 0.12
        max: 0.45
      air_absorption_cutoff_hz:
        min: 3500
        max: 8000
      room_noise_snr_db:
        min: 28
        max: 40
- id: noise
  severity: strong_random
  operations:
  - primitive: noise_interference
    variant: broadband
    parameters:
      snr_db:
        min: 18
        max: 30
- id: hum
  severity: strong_random
  operations:
  - primitive: noise_interference
    variant: hum
    parameters:
      snr_db:
        min: 3
        max: 10
      frequency_hz:
        choices:
        - 50
        - 60
      harmonics:
        min: 3
        max: 6
- id: clicks_crackle
  severity: strong_random
  operations:
  - primitive: noise_interference
    variant: clicks_crackle
    parameters:
      click_rate_hz:
        min: 3.0
        max: 8.0
      crackle_rate_hz:
        min: 25.0
        max: 70.0
      click_level_db:
        min: 0
        max: 9
      crackle_level_db:
        min: -16
        max: -8
      click_duration_ms:
        min: 2.0
        max: 6.0
      crackle_duration_ms:
        min: 0.25
        max: 1.0
- id: dropouts_glitches
  severity: strong_random
  operations:
  - primitive: dropouts_glitches
    parameters:
      mode:
        choices:
        - dropout
        - repeat
        - noise
        - attenuate
      rate_hz:
        min: 2.0
        max: 6.0
      min_duration_ms:
        min: 12
        max: 25
      max_duration_ms:
        min: 40
        max: 90
- id: codec
  severity: strong_random
  operations:
  - primitive: codec_resampling
    variant: mp3
    parameters:
      bitrate:
        choices:
        - 24k
        - 32k
        - 48k
- id: neural_codec
  severity: strong_random
  operations:
  - primitive: neural_codec
    parameters:
      intermediate_sample_rate:
        choices:
        - 8000
        - 12000
        - 16000
      quantization_bits:
        choices:
        - 5
        - 6
        - 7
- id: stereo_collapse
  severity: strong_random
  operations:
  - primitive: stereo_collapse
    parameters: {}
- id: channel_damage
  severity: strong_random
  operations:
  - primitive: channel_damage
    parameters:
      mode:
        choices:
        - bandwidth_loss
        - attenuation
        - delay
        - polarity_inversion
        - dropout
        - noise
        - distortion
      target_channel:
        choices:
        - 0
        - 1
- id: pitch_speed_instability
  severity: strong_random
  operations:
  - primitive: pitch_speed_instability
    parameters:
      wow_rate_hz:
        min: 0.25
        max: 1.0
      wow_depth_percent:
        min: 0.8
        max: 2.2
      flutter_rate_hz:
        min: 4.0
        max: 10.0
      flutter_depth_percent:
        min: 0.25
        max: 0.8
