version: v0.1
sample_rate: 44100
# ARIEL/SonicMaster single degradations. Each effect samples original ARIEL
# parameter choices from the item seed; there are deliberately no preset levels.
recipes:
  - {id: single_comp, severity: ariel_random, operations: [{primitive: ariel, variant: comp, parameters: {}}]}
  - {id: single_punch, severity: ariel_random, operations: [{primitive: ariel, variant: punch, parameters: {}}]}
  - {id: single_xband, severity: ariel_random, operations: [{primitive: ariel, variant: xband, parameters: {}}]}
  # Provide mic_ir_dir when rendering this recipe.
  - {id: single_mic, severity: ariel_random, operations: [{primitive: ariel, variant: mic, parameters: {}}]}
  - {id: single_bright, severity: ariel_random, operations: [{primitive: ariel, variant: bright, parameters: {}}]}
  - {id: single_dark, severity: ariel_random, operations: [{primitive: ariel, variant: dark, parameters: {}}]}
  - {id: single_airy, severity: ariel_random, operations: [{primitive: ariel, variant: airy, parameters: {}}]}
  - {id: single_boom, severity: ariel_random, operations: [{primitive: ariel, variant: boom, parameters: {}}]}
  - {id: single_clarity, severity: ariel_random, operations: [{primitive: ariel, variant: clarity, parameters: {}}]}
  - {id: single_mud, severity: ariel_random, operations: [{primitive: ariel, variant: mud, parameters: {}}]}
  - {id: single_warm, severity: ariel_random, operations: [{primitive: ariel, variant: warm, parameters: {}}]}
  - {id: single_vocal, severity: ariel_random, operations: [{primitive: ariel, variant: vocal, parameters: {}}]}
  - {id: single_small, severity: ariel_random, operations: [{primitive: ariel, variant: small, parameters: {}}]}
  - {id: single_big, severity: ariel_random, operations: [{primitive: ariel, variant: big, parameters: {}}]}
  - {id: single_mix, severity: ariel_random, operations: [{primitive: ariel, variant: mix, parameters: {}}]}
  # Provide real_rir_dir when rendering this recipe.
  - {id: single_real, severity: ariel_random, operations: [{primitive: ariel, variant: real, parameters: {}}]}
  - {id: single_stereo, severity: ariel_random, operations: [{primitive: ariel, variant: stereo, parameters: {}}]}
  - {id: single_clip, severity: ariel_random, operations: [{primitive: ariel, variant: clip, parameters: {}}]}
  - {id: single_volume, severity: ariel_random, operations: [{primitive: ariel, variant: volume, parameters: {}}]}
  # OpenRestore-specific single effects; random ranges are stored in metadata.
  - {id: single_noise, severity: openrestore_random, operations: [{primitive: noise_interference, variant: broadband, parameters: {snr_db: {min: 18, max: 35}}}]}
  - {id: single_hum, severity: openrestore_random, operations: [{primitive: noise_interference, variant: hum, parameters: {snr_db: {min: 7, max: 14}, frequency_hz: {choices: [50, 60]}, harmonics: {min: 3, max: 5}}}]}
  - {id: single_clicks_crackle, severity: openrestore_random, operations: [{primitive: noise_interference, variant: clicks_crackle, parameters: {click_rate_hz: {min: 1.5, max: 5.0}, crackle_rate_hz: {min: 10.0, max: 40.0}, click_level_db: {min: -3, max: 6}, crackle_level_db: {min: -20, max: -12}, click_duration_ms: {min: 2.0, max: 5.0}, crackle_duration_ms: {min: 0.25, max: 0.8}}}]}
  - {id: single_codec, severity: openrestore_random, operations: [{primitive: codec_resampling, variant: mp3, parameters: {bitrate: {choices: [32k, 48k, 64k]}}}]}
  - {id: single_bandwidth, severity: openrestore_random, operations: [{primitive: bandwidth_filtering, variant: lowpass, parameters: {cutoff_hz: {min: 7000, max: 10000}}}]}
  - {id: single_distant_mic_capture, severity: openrestore_random, operations: [{primitive: distant_mic_capture, variant: room_capture, parameters: {distance_m: {min: 1.5, max: 8.0}, absorption: {min: 0.12, max: 0.45}, air_absorption_cutoff_hz: {min: 4500, max: 12000}}}]}
