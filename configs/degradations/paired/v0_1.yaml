version: v0.1
sample_rate: 44100
recipes:
- id: paired_device_noise_medium
  recipe_type: paired
  severity: medium
  operations:
  - primitive: device_mic_response
    variant: consumer_mic
    parameters:
      low_hz:
        min: 80
        max: 180
      high_hz:
        min: 5500
        max: 9000
      self_noise_snr_db:
        min: 22
        max: 30
      mono_mix:
        min: 0.25
        max: 0.55
  - primitive: noise_interference
    variant: broadband
    parameters:
      snr_db:
        min: 28
        max: 36
- id: paired_reverb_eq_medium
  recipe_type: paired
  severity: medium
  operations:
  - primitive: reverb_room
    variant: mixed
    parameters:
      wet:
        min: 0.15
        max: 0.25
      decay_seconds:
        min: 0.5
        max: 0.9
      predelay_ms:
        min: 4
        max: 18
  - primitive: eq_coloration
    variant: boom
    parameters:
      gain_db:
        min: 2
        max: 3.5
      frequency_hz:
        min: 120
        max: 320
