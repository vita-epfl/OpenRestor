version: v0.1
sample_rate: 44100
recipes:
- id: organic_device_codec_noise_medium
  recipe_type: organic
  severity: medium
  operations:
  - primitive: device_mic_response
    variant: consumer_mic
    parameters:
      low_hz:
        min: 80
        max: 180
      high_hz:
        min: 5500
        max: 9000
      self_noise_snr_db:
        min: 22
        max: 30
      mono_mix:
        min: 0.25
        max: 0.55
  - primitive: codec_resampling
    variant: mp3
    parameters:
      codec: mp3
      bitrate:
        choices:
        - 160k
  - primitive: noise_interference
    variant: broadband
    parameters:
      snr_db:
        min: 28
        max: 36
