  - {id: review_high_hum, severity: high_preview, operations: [{primitive: noise_interference, variant: hum, parameters: {snr_db: 3, frequency_hz: 60, harmonics: 6, review_boundary: high}}]}
  - {id: review_low_clicks_crackle, severity: low_preview, operations: [{primitive: noise_interference, variant: clicks_crackle, parameters: {click_rate_hz: 3.0, crackle_rate_hz: 25.0, click_level_db: 0, crackle_level_db: -16, click_duration_ms: 2.0, crackle_duration_ms: 0.25, review_boundary: low}}]}
  - {id: review_high_clicks_crackle, severity: high_preview, operations: [{primitive: noise_interference, variant: clicks_crackle, parameters: {click_rate_hz: 8.0, crackle_rate_hz: 70.0, click_level_db: 9, crackle_level_db: -8, click_duration_ms: 6.0, crackle_duration_ms: 1.0, review_boundary: high}}]}
