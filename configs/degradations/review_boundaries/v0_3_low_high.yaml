version: v0.3
sample_rate: 44100
# Fixed low/high endpoints for listening review of the canonical 24-class registry.
# This is not a production recipe configuration.
recipes:
  - {id: review_low_spectral_eq, severity: low_preview, operations: [{primitive: spectral_eq, variant: broad_tilt, parameters: {pivot_hz: 1200, tilt_db: 7, review_boundary: low}}]}
  - {id: review_high_spectral_eq, severity: high_preview, operations: [{primitive: spectral_eq, variant: broad_tilt, parameters: {pivot_hz: 1200, tilt_db: 14, review_boundary: high}}]}
  - {id: review_low_mic, severity: low_preview, operations: [{primitive: microphone_response, parameters: {mic_ir_dir: assets/degradations/v0_1/microphone_irs, mic_number: 10, wet: 0.35, review_boundary: low}}]}
  - {id: review_high_mic, severity: high_preview, operations: [{primitive: microphone_response, parameters: {mic_ir_dir: assets/degradations/v0_1/microphone_irs, mic_number: 10, wet: 1.0, review_boundary: high}}]}
  - {id: review_low_lowpass, severity: low_preview, operations: [{primitive: bandwidth_filtering, variant: lowpass, parameters: {cutoff_hz: 6000, preset: butterworth, review_boundary: low}}]}
  - {id: review_high_lowpass, severity: high_preview, operations: [{primitive: bandwidth_filtering, variant: lowpass, parameters: {cutoff_hz: 2500, preset: butterworth, review_boundary: high}}]}
  - {id: review_low_highpass, severity: low_preview, operations: [{primitive: bandwidth_filtering, variant: highpass, parameters: {cutoff_hz: 300, review_boundary: low}}]}
