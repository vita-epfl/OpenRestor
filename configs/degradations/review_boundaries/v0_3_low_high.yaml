  - {id: review_high_telephone_band, severity: high_preview, operations: [{primitive: bandwidth_filtering, variant: telephone, parameters: {low_hz: 450, high_hz: 2800, review_boundary: high}}]}
  - {id: review_low_low_sample_rate, severity: low_preview, operations: [{primitive: bandwidth_filtering, variant: low_sample_rate, parameters: {intermediate_sample_rate: 12000, review_boundary: low}}]}
  - {id: review_high_low_sample_rate, severity: high_preview, operations: [{primitive: bandwidth_filtering, variant: low_sample_rate, parameters: {intermediate_sample_rate: 6000, review_boundary: high}}]}
  - {id: review_low_compression, severity: low_preview, operations: [{primitive: compression, variant: strong_compression, parameters: {preview_strength: low, review_boundary: low}}]}
