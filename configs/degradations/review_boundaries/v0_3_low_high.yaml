  - {id: review_low_reverb_real, severity: low_preview, operations: [{primitive: ariel, variant: real, parameters: {real_rir_dir: assets/degradations/v0_1/real_rirs, rir_index: 3, wet: 0.25, review_boundary: low}}]}
