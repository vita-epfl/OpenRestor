  - {id: review_high_channel_damage, severity: high_preview, operations: [{primitive: channel_damage, variant: attenuation, parameters: {target_channel: 1, gain_db: -24, review_boundary: high}}]}
  - {id: review_low_pitch_speed_instability, severity: low_preview, operations: [{primitive: pitch_speed_instability, parameters: {wow_rate_hz: 0.25, wow_depth_percent: 0.8, flutter_rate_hz: 4.0, flutter_depth_percent: 0.25, review_boundary: low}}]}
  - {id: review_high_pitch_speed_instability, severity: high_preview, operations: [{primitive: pitch_speed_instability, parameters: {wow_rate_hz: 1.0, wow_depth_percent: 2.2, flutter_rate_hz: 10.0, flutter_depth_percent: 0.8, review_boundary: high}}]}
