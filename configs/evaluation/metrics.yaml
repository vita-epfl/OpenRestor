benchmark_version: v0.1
submission_id: local
metric_pack: cpu_core_v0_1
sample_rate: 44100
analysis:
  n_fft: 2048
  hop_length: 512
  n_mels: 128
  mrstft_resolutions: [512, 1024, 2048]
  # Paired clean-to-evaluated transfer diagnostics for reverb and distant capture.
  reverb_diagnostics:
    max_ir_seconds: 3.0
    regularization: 0.0001
    direct_window_ms: 2.5
    early_window_ms: 50.0
    late_start_ms: 80.0
    max_rt60_seconds: 12.0
    identity_relative_error: 1.0e-12
validation:
  duration_tolerance_samples: 0
diagnostics:
  aggregation: category_primary_with_effect_detail
  enabled_categories: [spectral_eq, mic, lowpass, highpass, compression, clipping, saturation_overdrive, reverb, distant_mic_capture, noise, hum, clicks_crackle, dropouts_glitches, codec, neural_codec, stereo_collapse, channel_damage, pitch_speed_instability]
deferred_gpu_metric_pack: [CLAP, PANNS, FAD, FAD_LAION, Audiobox]
